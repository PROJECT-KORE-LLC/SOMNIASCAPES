<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Deep, Textured Ancient Stone Vault Background -->
    <linearGradient id="vault-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020204"/>
      <stop offset="50%" stop-color="#09070f"/>
      <stop offset="100%" stop-color="#030206"/>
    </linearGradient>

    <!-- Heavy, Aged Gold Leaf Texture Simulation -->
    <linearGradient id="gold-leaf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a6f27"/>
      <stop offset="15%" stop-color="#d4af37"/>
      <stop offset="30%" stop-color="#f5e1a4"/>
      <stop offset="45%" stop-color="#aa842c"/>
      <stop offset="70%" stop-color="#efd07b"/>
      <stop offset="85%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#6e551c"/>
    </linearGradient>

    <!-- Deep Bezel Shadow for the Inset Glass Panel -->
    <filter id="bezel-inset" x="-10%" y="-10%" width="120%" height="120%">
      <feOffset dx="0" dy="4"/>
      <feGaussianBlur stdDeviation="8" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#000000" flood-opacity="0.8" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>

    <!-- Vivid Ambient Crystal Glow (Somatic Amber) -->
    <radialGradient id="crystal-fire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9d00" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#09070f" stop-opacity="0"/>
    </radialGradient>

    <!-- Safe Native CSS Animation Matrix -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&amp;display=swap');

      .relic-pulse {
        animation: ancientBreathe 9s ease-in-out infinite;
        transform-origin: 600px 220px;
      }
      .panel-flicker {
        animation: glassGlow 12s ease-in-out infinite alternate;
      }
      .gothic-text {
        font-family: 'Cinzel', serif;
        font-weight: 400;
        letter-spacing: 26px;
        fill: url(#gold-leaf);
        filter: drop-shadow(0 0 14px rgba(212, 175, 55, 0.35));
      }
      
      @keyframes ancientBreathe {
        0% { transform: scale(0.96); opacity: 0.7; }
        50% { transform: scale(1.03); opacity: 1; filter: saturate(1.1); }
        100% { transform: scale(0.96); opacity: 0.7; }
      }
      @keyframes glassGlow {
        0% { opacity: 0.75; }
        50% { opacity: 0.9; }
        100% { opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Background Layer (The Dark Stone Cathedral) -->
  <rect width="1200" height="440" fill="url(#vault-bg)"/>

  <!-- Glowing Relic Core (Underneath the Glass) -->
  <circle cx="600" cy="220" r="320" fill="url(#crystal-fire)" class="relic-pulse" />

  <!-- The Ancient Beveled Outer Frame (ESO-Style Border Carvings) -->
  <g stroke="url(#gold-leaf)" fill="none" stroke-width="1.5" opacity="0.35">
    <!-- Frame Bounds -->
    <rect x="30" y="30" width="1140" height="380" rx="4" />
    <rect x="36" y="36" width="1128" height="368" rx="2" stroke-opacity="0.15" />
    
    <!-- Mythic Corner Relic Mounts -->
    <path d="M 20,45 L 45,45 L 45,20" stroke-width="2.5" stroke-opacity="0.6"/>
    <path d="M 1180,45 L 1155,45 L 1155,20" stroke-width="2.5" stroke-opacity="0.6"/>
    <path d="M 20,395 L 45,395 L 45,420" stroke-width="2.5" stroke-opacity="0.6"/>
    <path d="M 1180,395 L 1155,395 L 1155,420" stroke-width="2.5" stroke-opacity="0.6"/>
  </g>

  <!-- THE GLASSMORPHIC CONSOLE SLAB (Central Translucent Layer) -->
  <!-- This element mimics a solid sheet of heavy cut-glass suspended in an ancient metallic bezel -->
  <rect x="60" y="60" width="1080" height="320" rx="8" fill="#0d0a14" fill-opacity="0.65" filter="url(#bezel-inset)" class="panel-flicker"/>
  
  <!-- Polished Glass Bezel Edge Line -->
  <rect x="60" y="60" width="1080" height="320" rx="8" fill="none" stroke="url(#gold-leaf)" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Subtle Arcane Line Work (Etched directly onto the glass face) -->
  <g stroke="url(#gold-leaf)" stroke-opacity="0.12" stroke-width="1" fill="none">
    <line x1="60" y1="220" x2="1140" y2="220"/>
    <circle cx="600" cy="220" r="140" stroke-dasharray="4, 8"/>
    <circle cx="600" cy="220" r="110"/>
    
    <!-- Linear Horizon Anchors -->
    <line x1="400" y1="120" x2="400" y2="320"/>
    <line x1="800" y1="120" x2="800" y2="320"/>
  </g>

  <!-- Floating Fine Relic Markings (Ancient Sensory Triggers) -->
  <g fill="url(#gold-leaf)" opacity="0.3">
    <circle cx="600" cy="80" r="3" />
    <circle cx="600" cy="360" r="3" />
    <circle cx="400" cy="220" r="2.5" />
    <circle cx="800" cy="220" r="2.5" />
  </g>

  <!-- The Central Alluring Focus Name -->
  <g text-anchor="middle">
    <!-- Notice the alignment: perfectly dead-center inside the glassmorphic container -->
    <text x="613" y="244" font-size="74" class="gothic-text">SOMNIA</text>
  </g>
</svg>
