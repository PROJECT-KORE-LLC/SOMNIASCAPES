<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOMNIASCAPES // OS</title>
    <style>
        /* ============================================================
           SOMNIASCAPES — MODULAR MOBILE-FIRST OS
           Obsidian Glass • Accordion Dashboard • Moon's Hearth Mixer
           ============================================================ */

        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --primary: #D4AF37; 
            --primary-soft: rgba(212, 175, 55, 0.25);
            --primary-glow: rgba(212, 175, 55, 0.35);
            --hijack-glow: rgba(229, 149, 0, 0.4);
            --glass: rgba(10, 12, 16, 0.85);
            --glass-border: rgba(212, 175, 55, 0.25);
            --text-main: #F4EBD0;
            --text-muted: #a49a7c;
            --font-serif: 'Georgia', serif;
        }

        /* PALETTES */
        .noir-mode { --primary: #D4AF37; --hijack-glow: rgba(229, 149, 0, 0.4); --glass-border: rgba(212, 175, 55, 0.25); }
        .lunar-mode { --primary: #A5F2F3; --hijack-glow: rgba(0, 80, 150, 0.35); --glass-border: rgba(165, 242, 243, 0.25); }
        .vellum-mode { --primary: #C2B280; --hijack-glow: rgba(101, 67, 33, 0.35); --glass-border: rgba(194, 178, 128, 0.25); }
        .amethyst-mode { --primary: #9966CC; --hijack-glow: rgba(75, 0, 130, 0.35); --glass-border: rgba(153, 102, 204, 0.25); }

        body, html {
            margin: 0; padding: 0; background: #000;
            overflow-x: hidden; font-family: var(--font-serif);
            height: 100vh; width: 100vw; color: var(--text-main);
            -webkit-font-smoothing: antialiased; user-select: none;
        }

        /* --- VISUAL CANVAS --- */
        #bg-anchor {
            position: fixed; inset: 0; background: #020204;
            background-size: cover; background-position: center; z-index: 1;
            transition: filter 0.5s ease, background-image 1s ease;
        }
        #glow-layer {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 50%, var(--hijack-glow) 0%, transparent 80%);
            z-index: 2; opacity: 0.3; transition: opacity 0.5s ease, background 1s ease;
            pointer-events: none;
        }
        #particleCanvas {
            position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0.6;
        }

        /* --- TOP NAVIGATION BAR --- */
        #top-nav {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 100; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px;
        }
        .nav-logo { font-size: 1.2rem; letter-spacing: 4px; color: var(--primary); text-transform: uppercase; text-shadow: 0 0 10px var(--primary-glow); }
        .nav-actions { display: flex; gap: 10px; }
        .icon-btn {
            background: rgba(20,20,25,0.6); border: 1px solid var(--glass-border);
            color: var(--primary); padding: 6px 12px; border-radius: 4px; font-size: 0.65rem;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(5px);
        }
        .icon-btn:hover { background: var(--primary-soft); color: #fff; }

        /* --- MAIN DASHBOARD AREA --- */
        #dashboard {
            position: relative; z-index: 50; margin-top: 70px;
            padding: 0 15px 100px 15px; max-width: 600px; margin-left: auto; margin-right: auto;
            display: flex; flex-direction: column; gap: 12px;
            transition: opacity 0.4s ease, filter 0.4s ease;
        }
        body.cloaked #dashboard { opacity: 0; pointer-events: none; filter: blur(10px); }

        /* --- MODULAR ACCORDION PANELS --- */
        .module {
            background: var(--glass); backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border); border-radius: 8px;
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }
        .module-header {
            padding: 16px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; background: rgba(255,255,255,0.02);
            border-bottom: 1px solid transparent; transition: background 0.2s;
        }
        .module-header:hover { background: rgba(255,255,255,0.05); }
        .module-title { font-size: 0.85rem; letter-spacing: 3px; text-transform: uppercase; color: var(--primary); margin: 0; }
        .module-status { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        .module-content {
            display: none; padding: 16px; flex-direction: column; gap: 14px;
            background: rgba(0,0,0,0.4);
        }
        .module.active .module-content { display: flex; }
        .module.active .module-header { border-bottom: 1px solid var(--glass-border); }

        /* --- UI CONTROLS --- */
        .control-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .control-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        
        button.action-btn {
            background: rgba(0,0,0,0.6); border: 1px solid var(--glass-border); color: var(--text-main);
            padding: 10px; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase;
            border-radius: 4px; cursor: pointer; transition: 0.2s; font-family: inherit; width: 100%;
        }
        button.action-btn:hover, button.action-btn.active { background: var(--primary-soft); border-color: var(--primary); color: #fff; }

        .slider-group { display: flex; flex-direction: column; gap: 6px; }
        .slider-label { display: flex; justify-content: space-between; font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        input[type="range"] { -webkit-appearance: none; width: 100%; height: 2px; background: rgba(255,255,255,0.1); outline: none; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--primary); border-radius: 50%; cursor: pointer; box-shadow: 0 0 5px var(--primary); }

        .upload-zone {
            border: 1px dashed var(--glass-border); padding: 12px; text-align: center;
            border-radius: 4px; cursor: pointer; color: var(--text-muted); font-size: 0.65rem;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.2s; display: block;
        }
        .upload-zone:hover { background: rgba(255,255,255,0.05); color: var(--primary); border-color: var(--primary); }
        .upload-zone input { display: none; }

        textarea.scratchpad {
            width: 100%; height: 120px; background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border);
            border-radius: 4px; padding: 12px; color: #fff; font-family: inherit; font-size: 0.9rem;
            resize: none; outline: none; line-height: 1.5;
        }
        textarea.scratchpad:focus { border-color: var(--primary); }

        /* --- MOON'S HEARTH MIXER LIST --- */
        #mixer-list {
            max-height: 350px; overflow-y: auto; padding-right: 8px;
            display: flex; flex-direction: column; gap: 8px;
        }
        #mixer-list::-webkit-scrollbar { width: 4px; }
        #mixer-list::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        .mixer-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 14px; background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05); border-radius: 6px;
            transition: all 0.2s ease; gap: 15px;
        }
        .mixer-card.playing {
            border-color: var(--primary);
            background: var(--primary-glow);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .mixer-btn {
            background: none; border: none; color: var(--text-main);
            font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase;
            text-align: left; cursor: pointer; font-family: inherit; flex: 1; padding: 0;
            transition: color 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .mixer-card.playing .mixer-btn { color: #fff; text-shadow: 0 0 8px var(--primary); }
        .mixer-slider { width: 90px; }

        @media (min-width: 601px) {
            #dashboard { padding: 0; margin-top: 100px; }
        }
    </style>
</head>
<body id="os-body" class="noir-mode">

    <div id="bg-anchor"></div>
    <div id="glow-layer"></div>
    <canvas id="particleCanvas"></canvas>

    <nav id="top-nav">
        <div class="nav-logo">Somnia</div>
        <div class="nav-actions">
            <button class="icon-btn" onclick="toggleCloak()">Cloak</button>
            <button class="icon-btn" onclick="alert('Room Casting initialized.')">Cast</button>
            <button class="icon-btn" onclick="alert('Share link generated to clipboard.')">Share</button>
        </div>
    </nav>

    <main id="dashboard">

        <div class="module">
            <div class="module-header" onclick="toggleModule(this)">
                <h3 class="module-title">Presets</h3>
                <span class="module-status">3 Saved</span>
            </div>
            <div class="module-content">
                <div class="control-grid">
                    <button class="action-btn active" style="border-color: var(--primary);">★ Moon's Hearth</button>
                    <button class="action-btn">☆ Lunar Setup</button>
                    <button class="action-btn">☆ Empty Slot</button>
                    <button class="action-btn" style="border-color: #fff; color: #fff;" onclick="alert('Current state saved to slot.')">Save Current Vibe</button>
                </div>
            </div>
        </div>

        <div class="module">
            <div class="module-header" onclick="toggleModule(this)">
                <h3 class="module-title">Canvas Editor</h3>
                <span class="module-status">Visuals</span>
            </div>
            <div class="module-content">
                <label class="upload-zone">
                    <span>Upload Background Image</span>
                    <input type="file" accept="image/*" onchange="executeImageUpload(this)">
                </label>
                <div class="slider-group">
                    <div class="slider-label"><span>Lens Blur</span> <span id="blur-val">0px</span></div>
                    <input type="range" id="ctrl-blur" min="0" max="30" value="0" oninput="updateVisuals()">
                </div>
                <div class="slider-group">
                    <div class="slider-label">
