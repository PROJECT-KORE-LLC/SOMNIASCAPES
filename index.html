<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SomniaScapes — Emergency Vault</title>
    <style>
        /* === UNIFIED EMERGENCY SANCTUARY CORE SKIN === */
        :root {
            --primary: #d4af37;
            --primary-soft: rgba(212, 175, 55, 0.25);
            --bg-solid: #0b0b0f;
            --glass: rgba(15, 15, 22, 0.9);
            --glass-border: rgba(212, 175, 55, 0.3);
            --text-main: #e8dcb8;
            --text-muted: #a49a7c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background: var(--bg-solid);
            color: var(--text-main);
            font-family: 'Georgia', serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* --- IMMUTABLE FOREGROUND VAULT PILLAR --- */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 320px;
            height: 100vh;
            background: var(--glass);
            border-right: 2px solid var(--glass-border);
            box-shadow: 5px 0 25px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 20px;
            z-index: 90; /* Forces panel visibility above any background void */
            overflow-y: auto;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        body.cloaked #sidebar {
            transform: translateX(-100%);
            opacity: 0;
            pointer-events: none;
        }

        .logo {
            font-size: 1.4rem;
            letter-spacing: 4px;
            text-align: center;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-soft);
            margin-bottom: 10px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 14px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel h3 {
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
        }

        /* --- CARVED ELEMENT INTERACTION UTILITIES --- */
        button {
            background: #121216;
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            color: var(--text-main);
            padding: 10px;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        button:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 12px var(--primary);
        }

        .tool-btn-highlight {
            border-color: var(--primary);
            color: var(--primary);
            font-weight: bold;
            margin-top: auto;
        }

        /* --- VIEWPORT CANVAS SHROUD MATRIX --- */
        #viewport-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #14141c 0%, #050508 100%);
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .placeholder-notice {
            margin-left: 340px;
            color: var(--text-muted);
            font-style: italic;
            letter-spacing: 1px;
            text-align: center;
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <h2 class="logo">SOMNIASCAPES</h2>

        <section class="panel">
            <h3>Library Presets</h3>
            <button id="btn-vibe-1">Dreamroot Chamber</button>
            <button id="btn-vibe-2">Lunar Horizon</button>
        </section>

        <section class="panel">
            <h3>Chamber Acoustics</h3>
            <button id="btn-audio-toggle">Initialize Resonance Audio</button>
        </section>

        <button id="cloakButton" class="tool-btn-highlight">Cloak Architecture</button>
    </aside>

    <main id="viewport-canvas">
        <p class="placeholder-notice">Resonance Chamber Active. Awaiting Core Stream Matrix Initialization...</p>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const cloakBtn = document.getElementById("cloakButton");
            const sidebar = document.getElementById("sidebar");

            // Bulletproof Cloak execution path to force system visibility control
            if (cloakBtn && sidebar) {
                const uncloakHandler = (e) => {
                    if (sidebar.contains(e.target)) return;
                    document.body.classList.remove("cloaked");
                    document.removeEventListener("click", uncloakHandler);
                };

                cloakBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const isCloaked = document.body.classList.toggle("cloaked");
                    
                    if (isCloaked) {
                        document.addEventListener("click", uncloakHandler);
                    } else {
                        document.removeEventListener("click", uncloakHandler);
                    }
                });
            }

            // Standard fallback verification logs to ensure layout painting succeeds
            console.log("Emergency baseline vault successfully instantiated.");
        });
    </script>
</body>
</html>
