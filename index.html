<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SomniaScapes — Modular Resonance Vault — Liquid 13.0</title>
    <style>
        /* ============================================================
           SOMNIASCAPES — LIQUID 13.0 UNIFIED ARCHITECTURE
           Obsidian Glass • Modular Panel Toggles • Heavy RPG Skin
           ============================================================ */

        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --primary: #D4AF37; 
            --primary-soft: rgba(212, 175, 55, 0.25);
            --primary-glow: rgba(212, 175, 55, 0.35);
            --hijack-glow: rgba(229, 149, 0, 0.4);
            --glass: rgba(6, 6, 8, 0.96);
            --glass-heavy: rgba(3, 3, 5, 0.98);
            --glass-border: rgba(212, 175, 55, 0.22);
            --text-main: #F4EBD0;
            --text-muted: #a49a7c;
            --unison-tempo: 8s;
            --unison-ease: cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        .noir-mode { --primary: #D4AF37; --hijack-glow: rgba(229, 149, 0, 0.4); --glass: rgba(6, 6, 8, 0.96); --glass-border: rgba(212, 175, 55, 0.22); }
        .lunar-mode { --primary: #A5F2F3; --hijack-glow: rgba(0, 80, 150, 0.35); --glass: rgba(4, 8, 12, 0.96); --glass-border: rgba(165, 242, 243, 0.25); }
        .vellum-mode { --primary: #C2B280; --hijack-glow: rgba(101, 67, 33, 0.35); --glass: rgba(12, 10, 8, 0.96); --glass-border: rgba(194, 178, 128, 0.22); }
        .amethyst-mode { --primary: #9966CC; --hijack-glow: rgba(75, 0, 130, 0.35); --glass: rgba(10, 6, 12, 0.96); --glass-border: rgba(153, 102, 204, 0.25); }

        body, html {
            margin: 0; padding: 0; background: #000;
            overflow: hidden; font-family: 'Times New Roman', serif;
            height: 100%; width: 100%; color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* --- IMMUTABLE VISUAL LANDSCAPE LAYERS --- */
        #bg-anchor {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #020204;
            background-size: cover; background-position: center; z-index: 1;
            animation: flatlineBreath var(--unison-tempo) infinite alternate var(--unison-ease);
            will-change: transform; transform: translateZ(0);
            transition: background-image 1.5s var(--unison-ease);
        }
        @keyframes flatlineBreath { 0% { transform: scale(1) translateZ(0); } 100% { transform: scale(1.06) translateZ(0); } }

        #glow-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 20%, var(--hijack-glow) 80%, var(--hijack-glow) 100%);
            z-index: 5; pointer-events: none;
            animation: flatlineGlow var(--unison-tempo) infinite alternate var(--unison-ease);
            will-change: opacity; opacity: 0.2;
            transition: background 1.5s var(--unison-ease);
        }
        @keyframes flatlineGlow { 0% { opacity: 0.15; } 100% { opacity: 0.65; } }

        #particleCanvas {
            position: fixed; inset: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 6; opacity: 0.5;
        }

        /* --- THE MASTER SYSTEM VIEWPORT LAYER --- */
        #ui-viewport {
            position: relative; z-index: 100;
            height: 100vh; width: 100%;
            display: flex; justify-content: flex-start; align-items: center;
            padding: 0; box-sizing: border-box;
            transition: opacity 0.6s var(--unison-ease), transform 0.6s var(--unison-ease);
        }
        #ui-viewport.cloaked { opacity: 0 !important; pointer-events: none !important; transform: scale(0.98); }

        /* --- THE HEAVY OBSIDIAN SIDEBAR ARCHIVE --- */
        .vault-sidebar {
            width: 360px; height: 100vh;
            background: var(--glass);
            border-right: 2px solid var(--primary);
            padding: 24px; box-sizing: border-box;
            display: flex; flex-direction: column;
            box-shadow: 10px 0 50px #000, inset -5px 0 30px rgba(0,0,0,0.6);
            gap: 20px;
        }

        .vault-header {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 12px; flex-shrink: 0;
        }
        .vault-header h2 { 
            margin: 0; font-size: 1.3rem; letter-spacing: 4px;
            text-transform: uppercase; color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow); text-align: center;
        }

        .vault-scroll-container {
            flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
            padding-right: 4px; scrollbar-width: thin; scrollbar-color: var(--primary) transparent;
        }
        .vault-scroll-container::-webkit-scrollbar { width: 3px; }
        .vault-scroll-container::-webkit-scrollbar-thumb { background: var(--primary); }

        /* === MODERN MODULAR PANEL ENGINE STYLES === */
        .modular-panel {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
        }

        .modular-header {
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
        }
        .modular-header:hover {
            background: rgba(212, 175, 55, 0.04);
        }

        .modular-header h3 {
            margin: 0; font-size: 0.75rem; letter-spacing: 2px;
            text-transform: uppercase; color: var(--primary);
            transition: color 0.3s;
        }

        .module-status {
            font-size: 0.55rem; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 1px;
        }

        .modular-content {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* --- MODULAR COLLAPSED STATES --- */
        .modular-panel.collapsed {
            max-height: 41px; /* Locks execution display to header line alone */
        }
        .modular-panel.collapsed .modular-header {
            border-bottom-color: transparent;
        }
        .modular-panel.collapsed .modular-header h3 {
            color: var(--text-muted);
        }
        .modular-panel.collapsed .modular-content {
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
        }

        /* --- SYSTEM GRIDS AND SOUND BOARD MECHANICS --- */
        .mixer-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
        }
        .sound-card {
            background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 8px; text-align: center; transition: all 0.2s ease; border-radius: 2px;
        }
        .sound-card.active { background: var(--primary-glow); border-color: var(--primary); box-shadow: 0 0 6px var(--primary-glow); }

        /* --- CARVED USER INTERACTION PLATFORMS --- */
        button, .sound-btn {
            background: linear-gradient(180deg, rgba(15,15,20,0.6) 0%, rgba(5,5,8,0.8) 100%);
            border: 1px solid var(--glass-border); color: var(--text-main);
            font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; padding: 8px; font-family: inherit; width: 100%;
            transition: all 0.2s ease; text-align: center; border-radius: 3px;
        }
        button:hover, .sound-btn:hover { background: var(--primary-soft); border-color: var(--primary); }
        
        .sound-btn { border: none; padding: 2px 0 4px 0; color: var(--primary); }
        .sound-card.active .sound-btn { color: #fff; text-shadow: 0 0 5px #fff; }

        .volume-rail {
            -webkit-appearance: none; width: 100%; height: 2px;
            background: rgba(255, 255, 255, 0.08); outline: none; margin-top: 4px;
        }
        .volume-rail::-webkit-slider-thumb {
            -webkit-appearance: none; width: 8px; height: 8px; 
            background: var(--primary); cursor: pointer; border-radius: 0;
        }

        .slider-group {
            display: flex; flex-direction: column; gap: 2px; font-size: 0.65rem; color: var(--text-muted);
        }
        .command-array {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
        }
        .file-label {
            display: block; text-align: center; padding: 6px; border: 1px dashed var(--glass-border);
            font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); cursor: pointer;
        }
        .file-label input { display: none; }

        textarea {
            background: rgba(0,0,0,0.6); border: 1px solid var(--glass-border);
            padding: 8px; color: #fff; font-family: inherit; font-size: 0.75rem;
            resize: none; outline: none; height: 50px; border-radius: 2px;
        }
        textarea:focus { border-color: var(--primary); }

        .vault-divider { height: 1px; background: rgba(255,255,255,0.05); margin: 2px 0; }

        /* --- CLOAK HARDWARE OVERRIDE GAVEL --- */
        #cloak-btn {
            position: fixed; top: 20px; right: 20px; z-index: 2000;
            background: var(--glass-heavy); border: 1px solid var(--primary);
            color: var(--primary); padding: 8px 16px; cursor: pointer; 
            font-size: 0.6rem; text-transform: uppercase; letter-spacing: 3px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8); transition: 0.3s;
        }
        #cloak-btn:hover { background: var(--primary-glow); box-shadow: 0 0 15px var(--primary); }

        /* --- THE BROADCAST CONTROL SCRATCHPAD OVERLAY --- */
        #scratchpad {
            position: fixed; inset: 0; background: rgba(3,3,5,0.85);
            backdrop-filter: blur(20px); z-index: 1500;
            display: flex; justify-content: center; align-items: center;
        }
        #scratchpad.hidden { display: none !important; }
        .scratchpad-vault {
            background: var(--glass-heavy); border: 2px solid var(--primary);
            padding: 24px; width: 80%; max-width: 750px; box-shadow: 0 20px 60px #000;
            display: flex; flex-direction: column; gap: 16px; border-radius: 4px;
        }
        .scratchpad-vault textarea {
            height: 240px; font-size: 1.1rem; line-height: 1.5; padding: 14px;
            color: #fff; background: #000; border: 1px solid var(--glass-border);
        }

        /* --- SECONDARY DISPLAY MONITOR CANVAS GRAPHICS SPACER --- */
        .canvas-notice {
            flex: 1; display: flex; justify-content: center; align-items: center;
            color: var(--text-muted); font-style: italic; font-size: 0.85rem;
            letter-spacing: 1px; text-align: center; padding: 40px;
        }
    </style>
</head>
<body id="master-body" class="noir-mode" onclick="ghostRestore()">

    <button id="cloak-btn" onclick="toggleCloak(event)">CLOAK SYSTEM</button>

    <div id="bg-anchor"></div>
    <div id="glow-layer"></div>
    <canvas id="particleCanvas"></canvas>

    <div id="ui-viewport">
        <aside class="vault-sidebar" onclick="event.stopPropagation()">
            <div class="vault-header">
                <h2>SomniaScapes</h2>
            </div>

            <div class="vault-scroll-container">
                
                <div class="modular-panel" id="mod-presets">
                    <div class="modular-header" onclick="toggleModule('mod-presets')">
                        <h3>▼ Archive Presets</h3>
                        <span class="module-status">3 Slots</span>
                    </div>
                    <div class="modular-content">
                        <div class="command-array">
                            <button class="active" style="border-color: var(--primary);">★ Dreamroot</button>
                            <button class="empty" onclick="alert('Profile Slot II registered.')">☆ Add Vibe</button>
                            <button class="empty" onclick="alert('Profile Slot III registered.')">☆ Add Vibe</button>
                        </div>
                    </div>
                </div>

                <div class="modular-panel" id="mod-palettes">
                    <div class="modular-header" onclick="toggleModule('mod-palettes')">
                        <h3>▼ Visual Palettes</h3>
                        <span class="module-status">Noir</span>
                    </div>
                    <div class="modular-content">
                        <div class="command-array">
                            <button onclick="jolt('noir')">Noir</button>
                            <button onclick="jolt('lunar')">Lunar</button>
                            <button onclick="jolt('vellum')">Vellum</button>
                            <button onclick="jolt('amethyst')">Amethyst</button>
                        </div>
                    </div>
                </div>

                <div class="modular-panel" id="mod-calibration">
                    <div class="modular-header" onclick="toggleModule('mod-calibration')">
                        <h3>▼ Lens Calibration</h3>
                        <span class="module-status">Adjust</span>
                    </div>
                    <div class="modular-content">
                        <label class="slider-group">
                            <span>Background Focal Blur</span>
                            <input type="range" id="ctrl-blur" min="0" max="25" step="1" value="0" oninput="applyCalibration()">
                        </label>
                        <div class="vault-divider"></div>
                        <label class="file-label">
                            <span>Upload Custom Backdrop</span>
                            <input type="file" id="imageUpload" accept="image/*" onchange="executeLocalImage(this)">
                        </label>
                    </div>
                </div>

                <div class="modular-panel" id="mod-acoustics">
                    <div class="modular-header" onclick="toggleModule('mod-acoustics')">
                        <h3>▼ Resonance Matrix</h3>
                        <span class="module-status">22 Stems Available</span>
                    </div>
                    <div class="modular-content">
                        <div id="mixer-grid" class="mixer-grid"></div>
                        <button onclick="stopAll()" style="border-color: rgba(255,68,68,0.4); color: rgba(255,68,68,0.8); margin-top: 4px;">Mute All Elements</button>
                    </div>
                </div>

                <div class="modular-panel collapsed" id="mod-broadcast">
                    <div class="modular-header" onclick="toggleModule('mod-broadcast')">
                        <h3>▼ Broadcast Utility</h3>
                        <span class="module-status">Anchors</span>
                    </div>
                    <div class="modular-content">
                        <textarea id="prompt-field" placeholder="Scenario coordinates, structural parameters, or environment anchor notes..."></textarea>
                        <button onclick="toggleScratchpad(event)" style="border-color: var(--primary);">Open Broadcast Pad</button>
                    </div>
                </div>

            </div>
        </aside>

        <main class="canvas-notice">
            <p>Resonance Chamber Active. Awaiting Room Casting Handshake Vector...</p>
        </main>
    </div>

    <div id="scratchpad" class="hidden" onclick="toggleScratchpad(event)">
        <div class="scratchpad-vault" onclick="event.stopPropagation()">
            <textarea id="scratchpad-text" placeholder="Type family night scoreboards, beerpong points, homeschool lessons, or room pranks here..."></textarea>
            <button onclick="toggleScratchpad(event)">Dismiss Broadcast Pad</button>
        </div>
    </div>

    <script>
        let activeSoundscapes = {};
        let audioPrimed = false;

        // The Authentic Soundboard Library Loop Data Array
        const soundLibrary = [
            { id: "rain", name: "RAIN", url: "rain.mp3" }, { id: "thunder", name: "THUNDER", url: "thunder.mp3" },
            { id: "wind", name: "WIND", url: "winterwind.mp3" }, { id: "waves", name: "WAVES", url: "waves.mp3" },
            { id: "owls", name: "OWLS", url: "owls.mp3" }, { id: "raven", name: "RAVEN", url: "raven.mp3" },
            { id: "frogs", name: "FROGS", url: "frogs.mp3" }, { id: "crickets", name: "CRICKETS", url: "crickets.mp3" },
            { id: "fire", name: "FIRE", url: "fire.mp3" }, { id: "pot", name: "POT", url: "simmeringpot.mp3" },
            { id: "tea", name: "TEA", url: "teacup.mp3" }, { id: "clock", name: "CLOCK", url: "clock.mp3" },
            { id: "cat", name: "CAT", url: "cat.mp3" }, { id: "chimes", name: "CHIMES", url: "windchimes.mp3" },
            { id: "box1", name: "BOX I", url: "musicbox1.mp3" }, { id: "box2", name: "BOX II", url: "musicbox2.mp3" },
            { id: "box3", name: "BOX III", url: "musicbox3.mp3" }, { id: "yule1", name: "YULE I", url: "xmasmusicbox1.mp3" },
            { id: "yule2", name: "YULE II", url: "xmasmusicbox2.mp3" }, { id: "yule3", name: "YULE III", url: "xmasmusicbox3.mp3" },
            { id: "dark", name: "DARK", url: "darkmusic1.mp3" }, { id: "bin", name: "BINARY", url: "binarymusicbox.mp3" }
        ];

        // --- KINETIC HANDSHAKE INTERACTION HARVESTER ---
        function primeAudio() {
            if (!audioPrimed) {
                const silence = new Audio();
                silence.play().then(() => { silence.pause(); audioPrimed = true; }).catch(e => {});
            }
        }
        document.body.addEventListener('click', primeAudio, { once: true });

        // Instantiating the Sound Matrix Array Panel Items Natively
        function initGrid() {
            const grid = document.getElementById('mixer-grid');
            grid.innerHTML = soundLibrary.map(track => `
                <div class="sound-card" id="card-${track.id}">
                    <button class="sound-btn" onclick="toggleTrack('${track.id}', '${track.url}')">${track.name}</button>
                    <input type="range" class="volume-rail" min="0" max="1" step="0.05" value="0.5" oninput="changeVolume('${track.id}', this.value)">
                </div>`).join('');
        }

        window.toggleTrack = function(id, url) {
            const card = document.getElementById(`card-${id}`);
            if (activeSoundscapes[id]) {
                activeSoundscapes[id].pause();
                delete activeSoundscapes[id];
                card.classList.remove('active');
            } else {
                const audio = new Audio(url);
                audio.loop = true;
                audio.volume = card.querySelector('.volume-rail').value;
                audio.play().then(() => {
                    activeSoundscapes[id] = audio;
                    card.classList.add('active');
                    if (navigator.vibrate) navigator.vibrate(15);
                }).catch(e => console.warn("Physical strike context verification required."));
            }
        };

        window.changeVolume = function(id, vol) { 
            if (activeSoundscapes[id]) activeSoundscapes[id].volume = vol; 
        };

        window.stopAll = function() {
            Object.keys(activeSoundscapes).forEach(id => {
                activeSoundscapes[id].pause();
                const card = document.getElementById(`card-${id}`);
                if (card) card.classList.remove('active');
            });
            activeSoundscapes = {};
        };

        // === SYSTEM INTERFACE MODULAR COMPONENT ROUTER ===
        window.toggleModule = function(moduleId) {
            const mod = document.getElementById(moduleId);
            if (mod) {
                mod.classList.toggle('collapsed');
                if (navigator.vibrate) navigator.vibrate(12);
            }
        };

        // --- VISUAL PALETTE JOLTS ---
        function jolt(palette) {
            const body = document.getElementById('master-body');
            body.classList.remove('noir-mode', 'lunar-mode', 'vellum-mode', 'amethyst-mode');
            body.classList.add(`${palette}-mode`);
            
            // Sync status readout indicator texts
            const statusLabel = document.querySelector('#mod-palettes .module-status');
            if (statusLabel) statusLabel.textContent = palette;
            
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function applyCalibration() {
            const blurVal = document.getElementById('ctrl-blur').value;
            document.getElementById('bg-anchor').style.filter = `blur(${blurVal}px)`;
        }

        function executeLocalImage(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                document.getElementById('bg-anchor').style.backgroundImage = `url('${e.target.result}')`;
            };
            reader.readAsDataURL(file);
        }

        // --- CLOAK AND SYSTEM VEIL UTILITIES ---
        function toggleCloak(e) {
            e.stopPropagation();
            const viewport = document.getElementById('ui-viewport');
            const isCloaked = viewport.classList.toggle('cloaked');
            document.getElementById('cloak-btn').innerText = isCloaked ? "RESTORE SYSTEM" : "CLOAK SYSTEM";
        }

        function ghostRestore() {
            const viewport = document.getElementById('ui-viewport');
            if (viewport.classList.contains('cloaked')) {
                viewport.classList.remove('cloaked');
                document.getElementById('cloak-btn').innerText = "CLOAK SYSTEM";
            }
        }

        function toggleScratchpad(e) {
            e.stopPropagation();
            document.getElementById('scratchpad').classList.toggle('hidden');
        }

        // --- HIGH-VELOCITY AMBIENT COSMIC PARTICLE RESIDUE LOOP ENGINE ---
        function initParticles() {
            const canvas = document.getElementById('particleCanvas');
            const ctx = canvas.getContext('2d');
            let particles = [];

            const resize = () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            };
            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.5 + 0.5,
                    vX: (Math.random() - 0.5) * 0.4,
                    vY: (Math.random() - 0.5) * 0.4
                });
            }

            const loop = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "rgba(244, 235, 208, 0.25)";
                
                particles.forEach(p => {
                    p.x += p.vX;
                    p.y += p.vY;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                requestAnimationFrame(loop);
            };
            loop();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initGrid();
            initParticles();
        });
    </script>
</body>
</html>
