<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOMNIASCAPES // THE RESONANCE // LIQUID 13.0</title>
    <style>
        /* --- THE GEOMETRY GAVEL --- */
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --primary: #D4AF37; 
            --primary-glow: rgba(212, 175, 55, 0.35);
            --hijack-glow: rgba(229, 149, 0, 0.6);
            --glass: rgba(6, 6, 8, 0.98);
            --unison-tempo: 8s;
            --unison-ease: cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        .noir-mode { --primary: #D4AF37; --hijack-glow: rgba(229, 149, 0, 0.6); --glass: rgba(6, 6, 8, 0.98); }
        .lunar-mode { --primary: #A5F2F3; --hijack-glow: rgba(0, 80, 150, 0.5); --glass: rgba(4, 8, 12, 0.98); }
        .vellum-mode { --primary: #C2B280; --hijack-glow: rgba(101, 67, 33, 0.5); --glass: rgba(12, 10, 8, 0.98); }
        .amethyst-mode { --primary: #9966CC; --hijack-glow: rgba(75, 0, 130, 0.5); --glass: rgba(10, 6, 12, 0.98); }

        body, html {
            margin: 0; padding: 0; background: #000;
            overflow: hidden; font-family: 'Times New Roman', serif;
            height: 100%; width: 100%; color: #F4EBD0;
            -webkit-font-smoothing: antialiased;
            user-select: none;
        }

        /* --- THE HEARTH & SOMATIC GLOW --- */
        #bg-anchor {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #020204 url('resonance_8k.webp') no-repeat center center;
            background-size: cover; z-index: 1;
            animation: flatlineBreath var(--unison-tempo) infinite alternate var(--unison-ease);
            will-change: transform; transform: translateZ(0);
            transition: background-image 1.5s var(--unison-ease);
        }
        @keyframes flatlineBreath { 0% { transform: scale(1) translateZ(0); } 100% { transform: scale(1.08) translateZ(0); } }

        #glow-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 10%, var(--hijack-glow) 80%, var(--hijack-glow) 100%);
            z-index: 5; pointer-events: none;
            animation: flatlineGlow var(--unison-tempo) infinite alternate var(--unison-ease);
            will-change: opacity; opacity: 0.15;
            transition: background 1.5s var(--unison-ease);
        }
        @keyframes flatlineGlow { 0% { opacity: 0.15; } 100% { opacity: 0.75; } }

        #particleCanvas {
            position: fixed; inset: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 6; opacity: 0.4;
        }

        /* --- UI VIEWPORT --- */
        #ui-viewport {
            position: relative; z-index: 100;
            height: 100vh; width: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box;
            transition: opacity 1s var(--unison-ease);
        }
        #ui-viewport.cloaked { opacity: 0 !important; pointer-events: none !important; }

        /* --- THE MIXER VAULT --- */
        .mixer-vault {
            width: 100%; max-width: 950px; height: 85vh;
            background: var(--glass);
            border: 2px solid var(--primary);
            padding: 30px; box-sizing: border-box;
            display: flex; flex-direction: column;
            box-shadow: 0 0 100px #000, inset 0 0 40px var(--primary-glow);
            transition: all 1s var(--unison-ease);
            overflow: hidden;
        }

        .mixer-header {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .mixer-header h2 { 
            margin: 0; 
            font-size: clamp(1rem, 2vw, 1.4rem); 
            letter-spacing: clamp(4px, 1.5vw, 16px); 
            text-transform: uppercase; color: var(--primary);
            text-shadow: 0 0 15px var(--primary-glow);
        }

        .mixer-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 10px; flex: 1; overflow-y: auto; 
            padding-right: 10px; scrollbar-width: none;
        }
        .mixer-grid::-webkit-scrollbar { display: none; }

        .sound-card {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px; text-align: center; transition: 0.3s;
        }
        .sound-card.active { background: var(--primary-glow); border-color: var(--primary); }

        .sound-btn {
            background: none; border: none; color: var(--primary);
            font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; margin-bottom: 10px; font-family: inherit; width: 100%;
            touch-action: manipulation;
        }

        .volume-rail {
            -webkit-appearance: none; width: 100%; height: 2px;
            background: rgba(255, 255, 255, 0.1); outline: none;
        }
        .volume-rail::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px; 
            background: var(--primary); cursor: pointer; border-radius: 0;
        }

        /* --- CONTROL MECHANICS --- */
        .command-array {
            margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;
        }
        .lux-btn {
            background: rgba(0,0,0,0.6); border: 1px solid var(--primary);
            color: var(--primary); padding: 10px 20px; cursor: pointer;
            font-size: 0.6rem; text-transform: uppercase; letter-spacing: 3px;
            transition: 0.4s; touch-action: manipulation; white-space: nowrap;
            border-radius: 0; font-family: inherit;
        }
        .lux-btn:hover { background: var(--primary-glow); }

        .vault-io-group { display: flex; gap: 10px; margin-top: 15px; width: 100%; justify-content: center; }
        .file-label {
            border: 1px dashed var(--primary); padding: 10px 20px; font-size: 0.6rem;
            text-transform: uppercase; letter-spacing: 2px; cursor: pointer; color: var(--primary);
            display: inline-block; transition: 0.3s;
        }
        .file-label:hover { background: var(--primary-glow); }
        .file-label input { display: none; }

        /* --- THE CLOAK GAVEL --- */
        #cloak-btn {
            position: fixed; top: 20px; right: 20px; z-index: 2000;
            background: none; border: 1px solid var(--primary);
            color: var(--primary); padding: 8px 16px; cursor: pointer; 
            font-size: 0.55rem; text-transform: uppercase; letter-spacing: 3px;
            backdrop-filter: blur(5px); transition: 0.3s;
        }
        #cloak-btn:hover { background: var(--primary-glow); box-shadow: 0 0 15px var(--primary); }

        /* --- BROADCAST SCRATCHPAD VAULT SYSTEM --- */
        #scratchpad {
            position: fixed; inset: 0; background: rgba(3, 3, 5, 0.88);
            backdrop-filter: blur(20px); z-index: 1500;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.4s ease;
        }
        #scratchpad.hidden { display: none !important; }
        
        .scratchpad-vault {
            background: rgba(6, 6, 8, 0.98); border: 2px solid var(--primary);
            padding: 30px; width: 85%; max-width: 800px;
            box-shadow: 0 20px 60px #000, inset 0 0 40px var(--primary-glow);
            display: flex; flex-direction: column; gap: 16px;
        }
        .scratchpad-template-bar {
            display: flex; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--primary-soft);
            padding-bottom: 12px; margin-bottom: 4px;
        }
        .scratchpad-vault textarea {
            height: 280px; font-size: 1.2rem; line-height: 1.6; padding: 16px;
            color: #fff; background: #020204; border: 1px solid var(--primary-soft);
            font-family: var(--font-serif); resize: none; outline: none;
        }
        .scratchpad-vault textarea:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-soft); }

        @media (max-width: 800px) {
            .mixer-vault { height: 92vh; padding: 20px; }
            .mixer-grid { grid-template-columns: repeat(2, 1fr); }
            .sound-card { padding: 12px; }
            .lux-btn { flex: 1 1 45%; text-align: center; }
            #cloak-btn { top: 10px; right: 10px; padding: 6px 12px; font-size: 0.5rem; }
        }
    </style>
</head>
<body id="master-body" class="noir-mode" onclick="ghostRestore()">

    <button id="cloak-btn" onclick="window.toggleCloak(event)">CLOAK SYSTEM</button>

    <div id="bg-anchor"></div>
    <div id="glow-layer"></div>
    <canvas id="particleCanvas"></canvas>

    <div id="ui-viewport">
        <div class="mixer-vault" onclick="event.stopPropagation()">
            <div class="mixer-header">
                <h2>SomniaScapes</h2>
                <span style="font-size: 0.45rem; opacity: 0.4; letter-spacing: 4px;">RESONANCE MATRIX</span>
            </div>
            
            <div id="mixer-grid" class="mixer-grid"></div>

            <div class="vault-io-group">
                <label class="file-label">
                    <span>Upload Backdrop</span>
                    <input type="file" accept="image/*" onchange="window.executeLocalImage(this)">
                </label>
                <button class="lux-btn" onclick="window.toggleScratchpad(event)" style="margin: 0; padding: 10px 24px; border-color: var(--primary);">Open Broadcast Pad</button>
            </div>

            <div class="command-array">
                <button class="lux-btn" onclick="window.jolt('noir')">Noir</button>
                <button class="lux-btn" onclick="window.jolt('lunar')">Lunar</button>
                <button class="lux-btn" onclick="window.jolt('vellum')">Vellum</button>
                <button class="lux-btn" onclick="window.jolt('amethyst')">Amethyst</button>
                <button class="lux-btn" onclick="window.stopAll()" style="border-color: rgba(255,68,68,0.5); color: rgba(255,68,68,0.8);">Mute All Stems</button>
            </div>
        </div>
    </div>

    <div id="scratchpad" class="hidden" onclick="window.toggleScratchpad(event)">
        <div class="scratchpad-vault" onclick="event.stopPropagation()">
            <div class="scratchpad-template-bar">
                <button class="lux-btn" onclick="window.loadScratchTemplate('score')" style="padding: 6px 12px; font-size: 0.55rem;">Scoreboard</button>
                <button class="lux-btn" onclick="window.loadScratchTemplate('xp')" style="padding: 6px 12px; font-size: 0.55rem;">Prank XP Bar</button>
                <button class="lux-btn" onclick="window.loadScratchTemplate('fart')" style="padding: 6px 12px; font-size: 0.55rem; border-color: rgba(255,68,68,0.4); color: rgba(255,68,68,0.8);">Fart Noise Alert</button>
                <button class="lux-btn" onclick="window.loadScratchTemplate('clear')" style="padding: 6px 12px; font-size: 0.55rem; margin-left: auto; border-color: #666; color: #aaa;">Clear</button>
            </div>
            <textarea id="scratchpad-text" placeholder="Type family night scoreboards, beerpong points, homeschool lessons, or live room pranks here..."></textarea>
            <button class="lux-btn" onclick="window.toggleScratchpad(event)">Dismiss Broadcast Pad</button>
        </div>
    </div>

    <script>
        // Move execution handles directly to global window scope to resolve internal binding traps
        window.activeSoundscapes = {};
        window.audioPrimed = false;

        // The Authentic Soundboard Library Loop Data Array
        window.soundLibrary = [
            { id: "rain", name: "RAIN", url: "rain.mp3" }, { id: "thunder", name: "THUNDER", url: "thunder.mp3" },
            { id: "wind", name: "WIND", url: "winterwind.mp3" }, { id: "waves", name: "WAVES", url: "waves.mp3" },
            { id: "owls", name: "OWLS", url: "owls.mp3" }, { id: "raven", name: "RAVEN", url: "raven.mp3" },
            { id: "frogs", name: "FROGS", url: "frogs.mp3" }, { id: "crickets", name: "CRICKETS", url: "crickets.mp3" },
            { id: "fire", name: "FIRE", url: "fire.mp3" }, { id: "pot", name: "POT", url: "simmeringpot.mp3" },
            { id: "tea", name: "TEA", url: "teacup.mp3" }, { id: "clock", name: "CLOCK", url: "clock.mp3" },
            { id: "cat", name: "CAT", url: "cat.mp3" }, { id: "chimes", name: "CHIMES", url: "windchimes.mp3" },
            { id: "box1", name: "BOX I", url: "musicbox1.mp3" }, { id: "box2", name: "BOX II", url: "musicbox2.mp3" },
            { id: "box3", name: "BOX III", url: "musicbox3.mp3" }, { id: "yule1", name: "YULE I", url: "xmasmusicbox1.mp3" },
            { id: "yule2", name: "YULE II", url: "xmasmusicbox2.mp3" }, { id: "yule3", name: "YULE III", url: "xmasmusicbox3.mp3" },
            { id: "dark", name: "DARK", url: "darkmusic1.mp3" }, { id: "bin", name: "BINARY", url: "binarymusicbox.mp3" }
        ];

        // --- KINETIC HANDSHAKE INTERACTION HARVESTER ---
        window.primeAudio = function() {
            if (!window.audioPrimed) {
                const silence = new Audio();
                silence.play().then(() => { window.audioPrimed = true; }).catch(e => {});
            }
        };
        document.body.addEventListener('click', window.primeAudio, { once: true });

        // Instantiating the Sound Matrix Array Panel Items Natively
        window.initGrid = function() {
            const grid = document.getElementById('mixer-grid');
            if (!grid) return;
            grid.innerHTML = window.soundLibrary.map(track => `
                <div class="sound-card" id="card-${track.id}">
                    <button class="sound-btn" onclick="window.toggleTrack('${track.id}', '${track.url}')">${track.name}</button>
                    <input type="range" class="volume-rail" min="0" max="1" step="0.05" value="0.5" oninput="window.changeVolume('${track.id}', this.value)">
                </div>`).join('');
        };

        window.toggleTrack = function(id, url) {
            const card = document.getElementById(`card-${id}`);
            if (!card) return;
            
            if (window.activeSoundscapes[id]) {
                window.activeSoundscapes[id].pause();
                delete window.activeSoundscapes[id];
                card.classList.remove('active');
            } else {
                const audio = new Audio(url);
                audio.loop = true;
                audio.volume = card.querySelector('.volume-rail').value;
                audio.play().then(() => {
                    window.activeSoundscapes[id] = audio;
                    card.classList.add('active');
                    if (navigator.vibrate) navigator.vibrate(15);
                }).catch(e => console.warn("Physical strike context verification required."));
            }
        };

        window.changeVolume = function(id, vol) { 
            if (window.activeSoundscapes[id]) window.activeSoundscapes[id].volume = vol; 
        };

        window.stopAll = function() {
            Object.keys(window.activeSoundscapes).forEach(id => {
                window.activeSoundscapes[id].pause();
                const card = document.getElementById(`card-${id}`);
                if (card) card.classList.remove('active');
            });
            window.activeSoundscapes = {};
        };

        // --- VISUAL PALETTE JOLTS ---
        window.jolt = function(palette) {
            const body = document.getElementById('master-body');
            if (!body) return;
            body.className = `${palette}-mode`;
            if (navigator.vibrate) navigator.vibrate(20);
        };

        window.executeLocalImage = function(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const bg = document.getElementById('bg-anchor');
                if (bg) bg.style.backgroundImage = `url('${e.target.result}')`;
            };
            reader.readAsDataURL(file);
        };

        // --- CLOAK AND SYSTEM VEIL UTILITIES ---
        window.toggleCloak = function(e) {
            if (e) e.stopPropagation();
            const viewport = document.getElementById('ui-viewport');
            if (!viewport) return;
            const isCloaked = viewport.classList.toggle('cloaked');
            const btn = document.getElementById('cloak-btn');
            if (btn) btn.innerText = isCloaked ? "RESTORE SYSTEM" : "CLOAK SYSTEM";
        };

        window.ghostRestore = function() {
            const viewport = document.getElementById('ui-viewport');
            if (viewport && viewport.classList.contains('cloaked')) {
                viewport.classList.remove('cloaked');
                const btn = document.getElementById('cloak-btn');
                if (btn) btn.innerText = "CLOAK SYSTEM";
            }
        };

        window.toggleScratchpad = function(e) {
            if (e) e.stopPropagation();
            const pad = document.getElementById('scratchpad');
            if (pad) pad.classList.toggle('hidden');
        };

        // --- BROADCAST SCRATCHPAD TEMPLATE ROUTER ---
        window.loadScratchTemplate = function(type) {
            const txt = document.getElementById('scratchpad-text');
            if (!txt) return;

            if (type === 'score') {
                txt.value = "=== COZY PARTY SCOREBOARD ===\nHOME TEAM: 00  │  AWAY TEAM: 00\n-----------------------------------\n[Tap text box directly to adjust scores live]";
            } else if (type === 'xp') {
                txt.value = "⚡ PRANK CORE LEVEL UP!\n[██████████████████████████████] 100% XP\nSTATUS: GREMLIN MODE ACTIVATED // UNHINGED ENERGY";
            } else if (type === 'fart') {
                txt.value = "🚨 WARNING: METHANE DETECTION BLOCK FILTER TRIGGERED\nCRITICAL ROOM VENTILATION FAILURE STANDBY FOR IMPACT...";
                if (navigator.vibrate) navigator.vibrate([120, 60, 120, 60, 400]);
            } else if (type === 'clear') {
                txt.value = "";
            }
        };

        // --- HIGH-VELOCITY AMBIENT COSMIC PARTICLE RESIDUE LOOP ENGINE ---
        window.initParticles = function() {
            const canvas = document.getElementById('particleCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            let particles = [];

            const resize = () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            };
            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.5 + 0.5,
                    vX: (Math.random() - 0.5) * 0.4,
                    vY: (Math.random() - 0.5) * 0.4
                });
            }

            const loop = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "rgba(244, 235, 208, 0.25)";
                
                particles.forEach(p => {
                    p.x += p.vX;
                    p.y += p.vY;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                requestAnimationFrame(loop);
            };
            loop();
        };

        document.addEventListener('DOMContentLoaded', () => {
            window.initGrid();
            window.initParticles();
        });
    </script>
</body>
</html>
