<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SomniaScapes</title>

    <link rel="stylesheet" href="somniascapes.css">
</head>

<body class="noir">

    <!-- === EDITOR SIDEBAR (ADDED) === -->
    <aside id="sidebar">

        <h2 class="logo">SOMNIASCAPES</h2>

        <section class="panel">
            <h3>Background</h3>
            <div id="bg-picker" class="picker-grid"></div>
        </section>

        <section class="panel">
            <h3>Audio</h3>
            <div id="audio-picker" class="picker-grid"></div>
        </section>

        <section class="panel">
            <h3>Particles</h3>
            <div id="particle-picker" class="picker-grid"></div>
        </section>

        <section class="panel">
            <h3>Palette</h3>
            <div id="palette-picker" class="picker-grid"></div>
        </section>

        <section class="panel">
            <h3>Adjustments</h3>

            <label>Blur</label>
            <input type="range" id="blur-slider" min="0" max="20" value="0">

            <label>Brightness</label>
            <input type="range" id="brightness-slider" min="50" max="150" value="100">

            <label>Zoom</label>
            <input type="range" id="zoom-slider" min="1" max="2" step="0.01" value="1">
        </section>

        <button id="cloak-btn">Cloak</button>
        <button id="scratchpad-btn">Scratchpad</button>

    </aside>
    <!-- === END SIDEBAR === -->


    <!-- Main Vibe Container (YOUR ORIGINAL) -->
    <div id="vibe-container">
        <img id="vibe-image" src="" alt="">
        <audio id="vibe-audio" loop></audio>
    </div>

    <div id="vignette"></div>
    <canvas id="particleCanvas"></canvas>
    <div id="blurPulse"></div>

    <!-- === PREVIEW CANVAS (ADDED) === -->
    <main id="preview-area">
        <canvas id="scene-canvas"></canvas>
    </main>
    <!-- === END PREVIEW === -->


    <!-- UI Controls (YOUR ORIGINAL) -->
    <div id="controls">

        <label>
            Upload Image:
            <input type="file" id="imageUpload" accept="image/*">
        </label>

        <label>
            Upload Sound:
            <input type="file" id="soundUpload" accept="audio/*">
        </label>

        <!-- Sliders -->
        <label>
            Zoom
            <input type="range" id="ctrl-zoom" min="0.5" max="3" step="0.01" value="1">
        </label>

        <label>
            Blur
            <input type="range" id="ctrl-blur" min="0" max="20" step="0.5" value="0">
        </label>

        <label>
            Brightness
            <input type="range" id="ctrl-brightness" min="0.2" max="2" step="0.05" value="1">
        </label>

        <label>
            Opacity
            <input type="range" id="ctrl-opacity" min="0.1" max="1" step="0.05" value="1">
        </label>

        <label>
            Volume
            <input type="range" id="ctrl-volume" min="0" max="1" step="0.01" value="0.6">
        </label>

        <!-- Buttons -->
        <button id="castButton">Cast</button>
        <button id="toggleScratchpad">Scratchpad</button>
        <button id="cloakButton">Cloak</button>

        <!-- Palette Buttons -->
        <button class="paletteBtn" data-mode="noir">Noir</button>
        <button class="paletteBtn" data-mode="lunar">Lunar</button>
        <button class="paletteBtn" data-mode="vellum">Vellum</button>
        <button class="paletteBtn" data-mode="amethyst">Amethyst</button>

    </div>

    <!-- === SCRATCHPAD OVERLAY (MERGED + IMPROVED) === -->
    <div id="scratchpad" class="hidden">
        <textarea placeholder="Write a message..."></textarea>
        <button id="close-scratchpad">Close</button>
    </div>
    <!-- === END SCRATCHPAD === -->

    <script src="somniascapes.js"></script>
</body>
</html>
