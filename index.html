<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SOMNIASCAPES // OS</title>
    <style>
        /* ============================================================
           SOMNIASCAPES — MODULAR AMBIENCE MAKER
           ============================================================ */

        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --primary: #d8b4e2;
            --primary-glow: rgba(216, 180, 226, 0.4);
            --accent: #2dd4bf;
            --glass: rgba(10, 15, 25, 0.85);
            --glass-border: rgba(216, 180, 226, 0.2);
            --text-main: #fdfbf7;
            --text-muted: #a09ba5;
        }

        body, html {
            margin: 0; padding: 0; background: #000;
            overflow: hidden; font-family: 'Georgia', serif;
            height: 100vh; width: 100vw; color: var(--text-main);
            -webkit-font-smoothing: antialiased; user-select: none;
        }

        /* --- VISUAL CANVAS --- */
        #bg-anchor {
            position: fixed; inset: 0; 
            /* REFRESHED: Now using ship.png */
            background: #000 url('ship.png') no-repeat center center;
            background-size: cover; z-index: 1;
            transition: filter 0.5s ease;
        }
        #glow-layer {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 50%, var(--primary-glow) 0%, transparent 70%);
            z-index: 2; opacity: 0.3; pointer-events: none;
        }
        #particleCanvas {
            position: fixed; inset: 0; z-index: 3; pointer-events: none; opacity: 0.6;
        }

        /* --- UI LAYER --- */
        #ui-viewport {
            position: relative; z-index: 100;
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* Floating Panel */
        #maker-panel {
            width: 90%; max-width: 600px;
            background: var(--glass); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* Simple Tab System */
        .tab-bar { display: flex; border-bottom: 1px solid var(--glass-border); }
        .tab-btn {
            flex: 1; background: none; border: none; color: var(--text-muted);
            padding: 15px; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; border-bottom: 2px solid transparent;
        }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

        .tab-content { display: none; padding: 20px; max-height: 40vh; overflow-y: auto; }
        .tab-content.active { display: flex; flex-direction: column; gap: 15px; }

        /* Mixer Styling */
        .mixer-card {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px; background: rgba(255,255,255,0.03); border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05); gap: 10px;
        }
        .mixer-btn {
            background: none; border: none; color: var(--text-main); font-size: 0.8rem;
            cursor: pointer; text-align: left; flex: 1;
        }
        .mixer-card.playing .mixer-btn { color: var(--accent); }
        .mixer-slider { width: 80px; accent-color: var(--accent); }

        /* Scratchpad */
        .scratchpad {
            width: 100%; height: 120px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border); border-radius: 8px;
            padding: 10px; color: #fff; font-family: inherit; resize: none;
        }

        .toy-btn {
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
            color: var(--text-main); padding: 8px; border-radius: 5px; cursor: pointer;
            font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="bg-anchor"></div>
    <div id="glow-layer"></div>
    <canvas id="particleCanvas"></canvas>

    <div id="ui-viewport">
        <main id="maker-panel">
            <div class="tab-bar">
                <button class="tab-btn active" onclick="switchTab('tab-audio', this)">Hearthsong</button>
                <button class="tab-btn" onclick="switchTab('tab-vault', this)">Scratchpad</button>
            </div>

            <div id="tab-audio" class="tab-content active">
                <div id="mixer-container"></div>
                <button class="toy-btn" onclick="stopAllAudio()">Silence All</button>
            </div>

            <div id="tab-vault" class="tab-content">
                <textarea id="scratchpad-box" class="scratchpad" placeholder="Type here..."></textarea>
                <button class="toy-btn" onclick="alert('Vibe Saved!')">Save Vibe</button>
            </div>
        </main>
    </div>

    <script>
        function switchTab(id, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        const activeAudio = {};
        const soundLibrary = [
            { id: "rain", name: "🌧️ Gentle Rain", url: "rain.mp3" },
            { id: "fire", name: "🔥 Hearth Fire", url: "fire.mp3" },
            { id: "clock", name: "🕰️ Ticking Clock", url: "clock.mp3" }
        ];

        function initMixer() {
            const container = document.getElementById('mixer-container');
            container.innerHTML = soundLibrary.map(track => `
                <div class="mixer-card" id="card-${track.id}">
                    <button class="mixer-btn" onclick="toggleStem('${track.id}', '${track.url}')">${track.name}</button>
                    <input type="range" id="vol-${track.id}" class="mixer-slider" min="0" max="1" step="0.05" value="0.5">
                </div>
            `).join('');
        }

        function toggleStem(id, url) {
            const card = document.getElementById(`card-${id}`);
            if (activeAudio[id]) {
                activeAudio[id].pause(); delete activeAudio[id];
                card.classList.remove('playing');
            } else {
                const audio = new Audio(url); audio.loop = true;
                audio.volume = document.getElementById(`vol-${id}`).value;
                audio.play().then(() => { activeAudio[id] = audio; card.classList.add('playing'); });
            }
        }

        function stopAllAudio() {
            Object.keys(activeAudio).forEach(id => {
                activeAudio[id].pause();
                document.getElementById(`card-${id}`).classList.remove('playing');
            });
            for (let prop in activeAudio) delete activeAudio[prop];
        }

        document.addEventListener('DOMContentLoaded', initMixer);
    </script>
</body>
</html>
