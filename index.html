<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SomniaScapes — Unified Core Reset</title>
    <style>
        /* ============================================================
           SOMNIASCAPES — EMERGENCY ARCHITECTURE RESET
           Self-Contained • High Visibility • No Shroud Lockouts
           ============================================================ */

        :root {
            --primary: #d4af37;
            --primary-soft: rgba(212, 175, 55, 0.25);
            --bg-solid: #08080c;
            --glass: rgba(12, 12, 18, 0.95);
            --glass-border: rgba(212, 175, 55, 0.3);
            --text-main: #e8dcb8;
            --text-muted: #a49a7c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg-solid);
            color: var(--text-main);
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* --- THE HEAVY OBSIDIAN PILLAR (Forced Layout Width) --- */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 360px; /* Expanded width to guarantee the title text doesn't chop */
            height: 100vh;
            background: var(--glass);
            border-right: 2px solid var(--glass-border);
            box-shadow: 8px 0 30px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            padding: 24px;
            gap: 22px;
            z-index: 99; /* Forces the control panel to stay in front of everything */
            overflow-y: auto;
        }

        .logo {
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-align: center;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-soft);
            border-bottom: 2px solid var(--glass-border);
            padding-bottom: 12px;
            margin-bottom: 10px;
        }

        .panel {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel h3 {
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--primary);
            border-bottom: 1px solid rgba(212,175,55,0.1);
            padding-bottom: 4px;
        }

        /* --- HEAVY MECHANICAL UTILITY CONTROLS --- */
        button {
            background: linear-gradient(180deg, #14141a 0%, #0a0a0f 100%);
            border: 1px solid var(--glass-border);
            border-radius: 4px;
            color: var(--text-main);
            padding: 12px;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        button:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary);
        }

        .tool-btn-highlight {
            border-color: var(--primary);
            color: var(--primary);
            font-weight: bold;
            margin-top: auto;
        }

        /* --- IMMUTABLE SCREEN ENVIRONMENT BACKDROP --- */
        #viewport-matrix {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #111116 0%, #040406 100%);
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ambient-text {
            margin-left: 380px; /* Offset to sit perfectly clear of our sidebar vault */
            color: var(--text-muted);
            font-style: italic;
            letter-spacing: 2px;
            text-align: center;
            font-size: 1rem;
        }

        #particleCanvas {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <aside id="sidebar">
        <h2 class="logo">SOMNIASCAPES</h2>

        <section class="panel">
            <h3>Library Environments</h3>
            <button id="btn-env-1" onclick="alert('Dreamroot state calibrated.')">Dreamroot Sanctuary</button>
            <button id="btn-env-2" onclick="alert('Lunar Tide state calibrated.')">Lunar Tide</button>
        </section>

        <section class="panel">
            <h3>Audio Core Mixer</h3>
            <button id="btn-audio-init">Initialize Chamber Audio Context</button>
        </section>

        <section class="panel">
            <h3>Tools Vectors</h3>
            <button onclick="alert('Scratchpad activated.')">Toggle Scratchpad</button>
        </section>

        <button id="cloakButton" class="tool-btn-highlight">Cloak Vault Interface</button>
    </aside>

    <main id="viewport-matrix">
        <p class="ambient-text">Resonance Chamber Stable. Awaiting Master Engine Broadcast Pipeline...</p>
        <canvas id="particleCanvas"></canvas>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const cloakBtn = document.getElementById("cloakButton");
            const sidebar = document.getElementById("sidebar");

            // Safe, direct visibility cloak routing logic
            if (cloakBtn && sidebar) {
                cloakBtn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const isHidden = sidebar.style.transform === "translateX(-100%)";
                    if (isHidden) {
                        sidebar.style.transform = "translateX(0)";
                        cloakBtn.textContent = "Cloak Vault Interface";
                    } else {
                        sidebar.style.transform = "translateX(-100%)";
                        cloakBtn.textContent = "Uncloak Architecture";
                    }
                });
            }

            // High-Velocity Particle Loop (No External Stutter)
            const canvas = document.getElementById("particleCanvas");
            const ctx = canvas.getContext("2d");
            let particles = [];

            const resize = () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            };
            window.addEventListener("resize", resize);
            resize();

            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 2 + 0.5,
                    vX: (Math.random() - 0.5) * 0.5,
                    vY: (Math.random() - 0.5) * 0.5
                });
            }

            const loop = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
                
                particles.forEach(p => {
                    p.x += p.vX;
                    p.y += p.vY;

                    if (p.x < 0) p.x = canvas.width;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.y < 0) p.y = canvas.height;
                    if (p.y > canvas.height) p.y = 0;

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                requestAnimationFrame(loop);
            };
            loop();

            console.log("Unified sandbox environment successfully painted.");
        });
    </script>
</body>
</html>
