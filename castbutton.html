<script type="text/javascript" src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

<google-cast-launcher class="artifact-btn"></google-cast-launcher>

<script>
    // Initialize the Google Cast Sender
    window['__onGCastApiAvailable'] = function(isAvailable) {
        if (isAvailable) {
            cast.framework.CastContext.getInstance().setOptions({
                receiverApplicationId: 'YOUR_APP_ID_HERE', // From Step 2
                autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED
            });
        }
    };

    // When the user changes a slider or color, broadcast it to the TV
    function broadcastToTV(stateObject) {
        const castSession = cast.framework.CastContext.getInstance().getCurrentSession();
        if (castSession) {
            castSession.sendMessage('urn:x-cast:com.somniascapes.engine', JSON.stringify(stateObject));
        }
    }
</script>
